<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maple.v1.001.26</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        padding: 30px 15px;
        text-align: center;
        background: radial-gradient(circle at top, #2c2c34 0%, #18181c 100%);
        color: #f4f4f6;
        min-height: 100vh;
    }

    /* Main Container */
    .app-wrapper {
        max-width: 1000px;
        margin: 0 auto;
    }

    /* Live Announcement Banner */
    #live-announcement {
        background: rgba(217, 56, 41, 0.14);
        border: 1px solid rgba(217, 56, 41, 0.45);
        border-radius: 16px;
        padding: 14px 20px;
        margin: 0 auto 24px auto;
        max-width: 750px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(6px);
    }

    #live-announcement h2,
    #live-announcement p {
        margin: 4px 0;
    }

    /* Headings */
    h1.brand-title {
        color: #ff4b3a;
        font-size: 2.2rem;
        letter-spacing: 1px;
        margin: 0 0 20px 0;
        text-shadow: 0 4px 15px rgba(255, 75, 58, 0.35);
    }

    h3.section-title {
        color: #ff4b3a;
        font-size: 1.25rem;
        margin: 30px 0 15px 0;
        letter-spacing: 0.5px;
    }

    /* URL Control Bar */
    .controls-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 10px;
        background: #23232a;
        padding: 14px 20px;
        border-radius: 20px;
        max-width: 750px;
        margin: 0 auto 12px auto;
        border: 1px solid #34343e;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .controls-bar label {
        font-weight: 600;
        color: #ccc;
        font-size: 0.95rem;
    }

    input {
        padding: 10px 16px;
        font-size: 15px;
        width: 280px;
        max-width: 100%;
        border-radius: 12px;
        border: 1px solid #3f3f4a;
        background-color: #16161a;
        color: white;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
        border-color: #ff4b3a;
        box-shadow: 0 0 0 3px rgba(255, 75, 58, 0.25);
    }

    /* Buttons */
    button {
        padding: 10px 20px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        border-radius: 12px;
        border: none;
        background-color: #32323c;
        color: #ffffff;
        transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    button:hover {
        background-color: #42424f;
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
    }

    button:active {
        transform: translateY(0);
    }

    button.primary-btn {
        background: linear-gradient(135deg, #ff4b3a, #c92a1d);
    }

    button.primary-btn:hover {
        background: linear-gradient(135deg, #ff5e4f, #db3224);
    }

    #output {
        font-size: 0.9rem;
        color: #a0a0b0;
        min-height: 20px;
        margin: 8px 0;
    }

    /* Iframe Viewer with Curved Edges */
    #iframeContainer {
        position: relative;
        width: 90%;
        height: 540px;
        margin: 15px auto 20px auto;
        border: 2px solid #383844;
        border-radius: 22px;
        overflow: hidden; /* Clips the iframe corners cleanly */
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
        background: #111;
    }

    iframe {
        width: 100%;
        height: 100%;
        border: none;
        background: white;
        display: block;
    }

    /* Game Launcher Grid */
    .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 14px;
        max-width: 820px;
        margin: 20px auto;
        padding: 0 10px;
    }

    .game-grid button {
        padding: 14px 16px;
        border-radius: 16px;
        background: #25252d;
        border: 1px solid #353540;
    }

    .game-grid button:hover {
        background: #ff4b3a;
        border-color: #ff4b3a;
    }

    hr {
        border: none;
        height: 1px;
        background: linear-gradient(90deg, transparent, #3a3a46, transparent);
        margin: 35px auto;
        max-width: 800px;
    }

    /* Footer Cards (Credits & History) */
    .footer-panels {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        max-width: 820px;
        margin: 25px auto 0 auto;
    }

    .card {
        flex: 1 1 340px;
        background: #222229;
        border: 1px solid #32323c;
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .card h3 {
        color: #ff4b3a;
        margin-top: 0;
        margin-bottom: 12px;
    }

    .card p {
        margin: 6px 0;
        color: #d4d4dc;
    }

    #historyList {
        list-style: none;
        padding: 0;
        margin: 10px 0 0 0;
        max-height: 140px;
        overflow-y: auto;
        text-align: left;
    }

    #historyList li {
        background: #18181d;
        padding: 8px 12px;
        margin-bottom: 6px;
        border-radius: 10px;
        font-size: 0.85rem;
        color: #b4b4c0;
        word-break: break-all;
        border: 1px solid #2b2b34;
    }
</style>
</head>
<body>

<div class="app-wrapper">

<p id="banner"></p>



    <h1 class="brand-title">Maple.v1.001.26</h1>

    <!-- URL Input Bar -->
    <div class="controls-bar">
        <label for="myTextbox">Enter URL:</label>
        <input type="text" id="myTextbox" placeholder="https://example.com/" onkeydown="if(event.key==='Enter') saveValue()">
        <button class="primary-btn" onclick="saveValue()">Load URL</button>
        <button onclick="loadPreset('https://example.com/')">Reset</button>
        <button id="fullscreenBtn">Fullscreen</button>
    </div>

    <p id="output"></p>

    <!-- Curved Iframe Viewer -->
    <div id="iframeContainer">
        <iframe id="myIframe" src="https://example.com/"></iframe>
    </div>

    <hr>

    <!-- Quick Launch Games Grid -->
    <h3 class="section-title">Quick Launch</h3>
    <div class="game-grid">
        <button onclick="loadPreset('https://slope3online.io/slippery-slope')">Slippery Slope</button>
        <button onclick="loadPreset('https://jellymar.io')">Jelly Mario</button>
        <button onclick="loadPreset('https://cymavis.com')">3D Water Sim</button>
        <button onclick="loadPreset('https://boredbutton.com')">Bored Button</button>
        <button onclick="loadPreset('https://driftboss3.io')">Drift Boss</button>
        <button onclick="loadPreset('https://binbashbanana.github.io/webretro/?core=mupen64plus_next')">N64 Emulator</button>
        <button onclick="loadPreset('https://slopeio.org')">Slope</button>
    </div>

    <!-- Credits & History Side-by-Side Cards -->
    <div class="footer-panels">
        <div class="card">
            <h3>Special Thanks to the Devs</h3>
            <p><strong>Sawyer</strong> — Main Developer</p>
            <p><strong>Sam</strong> — Co-Developer</p>
        </div>

        <div class="card">
            <h3>Recently Loaded URLs</h3>
            <ul id="historyList"></ul>
        </div>
    </div>

</div>

<script>
    function addToHistory(url) {
        const historyList = document.getElementById('historyList');
        const li = document.createElement('li');
        li.textContent = url;
        historyList.prepend(li); // Shows newest URLs at the top
    }

    function loadPreset(url) {
        document.getElementById('myIframe').src = url;
        document.getElementById('output').textContent = "Site URL: " + url;
        addToHistory(url);
    }

    function saveValue() {
        let myVariable = document.getElementById("myTextbox").value.trim();

        if (!myVariable) return;

        // Automatically format raw paths to safe web protocols
        if (!/^https?:\/\//i.test(myVariable)) {
            myVariable = "https://" + myVariable;
        }

        const targetIframe = document.getElementById("myIframe");

        // Reroute the domain input to its unblocked game asset engine mirror
        if (myVariable.includes("kodub.com") || myVariable.includes("polytrack")) {
            targetIframe.src = "https://polytrackunblockedgame.github.io/";
        } else {
            targetIframe.src = myVariable;
        }

        addToHistory(myVariable);
        document.getElementById("output").textContent = "Site URL: " + myVariable;
    }

    // Fullscreen execution mappings
    const iframeContainer = document.getElementById('iframeContainer');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    fullscreenBtn.addEventListener('click', () => {
        if (iframeContainer.requestFullscreen) {
            iframeContainer.requestFullscreen();
        } else if (iframeContainer.webkitRequestFullscreen) {
            iframeContainer.webkitRequestFullscreen();
        } else if (iframeContainer.msRequestFullscreen) {
            iframeContainer.msRequestFullscreen();
        }
    });
</script>
<script src="https://jabuticabatree.github.io/Maple/reference.js"></script>
<script>
document.getElementById("banner").textContent = banner;
</script>
</body>
</html>
