<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Text Rows</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9fafb;
      color: #111827;
    }

    input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 12px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    #status {
      font-size: 14px;
      color: #4b5563;
      margin-bottom: 16px;
      min-height: 20px;
    }

    .row {
      background: #ffffff;
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>

  <h2>Shared Text Entry</h2>
  <input type="password" id="tokenInput" placeholder="Paste GitHub Token to post updates...">
  <input type="text" id="textInput" placeholder="Type a message and press Enter...">
  <div id="status"></div>
  
  <div id="rowsContainer"></div>

  <!-- Cache-busted script tag so visitors always get the latest version -->
  <script>
    const script = document.createElement('script');
    script.src = 'https://theyellowsubmarine.github.io/Maple/chat.js' + Date.now();
    document.body.appendChild(script);
  </script>

</body>
</html>
