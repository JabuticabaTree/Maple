<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shared Text Rows</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 40px auto;
      padding: 0 20px;
      background-color: #f9fafb;
      color: #111827;
    }

    .row {
      background: #ffffff;
      padding: 12px 16px;
      margin-bottom: 8px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body>

  <h2>Shared Text</h2>
  <div id="rowsContainer"></div>

  <!-- Loads your text directly from GitHub Pages -->
  <script src="https://github.io"></script>

</body>
</html>
